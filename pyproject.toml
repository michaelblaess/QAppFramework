[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QAppFramework"
version = "0.1.0"
description = "Gemeinsame Bausteine fuer PySide6-Anwendungen: Erscheinungsbild, Sinnbilder und wiederkehrende Dialoge"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Michael Blaess" }]
dependencies = [
    "PySide6>=6.8",
    # Material Design Icons (Apache 2.0) als zur Laufzeit einfaerbbare QIcons.
    "QtAwesome>=1.4",
]

[project.urls]
Homepage = "https://github.com/michaelblaess/QAppFramework"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "poethepoet>=0.29",
    "ruff>=0.3",
]

[tool.poe.tasks]
test = { cmd = "pytest", help = "Tests" }
typecheck = { cmd = "mypy src", help = "mypy strict ueber src/" }
lint = { cmd = "ruff check .", help = "Ruff Linting" }
fmt = { cmd = "ruff format .", help = "Ruff Formatting" }

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561. Ohne diesen Marker ignorieren Konsumenten die Typangaben und
# brauchen einen mypy-Override je Anwendung.
[tool.setuptools.package-data]
QAppFramework = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501", "ASYNC109", "ASYNC240", "E402", "N806"]

[tool.ruff.lint.per-file-ignores]
# N999 verlangt kleingeschriebene Modulnamen (PEP 8). Der Paketname folgt hier
# bewusst PySide6 und PyQt6, damit Import- und Paketname identisch sind.
"src/QAppFramework/*" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["qtawesome.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
